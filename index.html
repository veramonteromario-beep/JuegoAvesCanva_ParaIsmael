<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Ninja: Las Aves</title>
    <style>
        :root {
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --blue-chidori: #3498db;
            --dark-akatsuki: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Impact, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images2.alphacoders.com/106/thumb-1920-1060703.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(26, 26, 26, 0.95);
            border: 4px solid var(--blue-chidori);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(52, 152, 219, 0.5);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            color: white;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        /* NUEVA ANIMACIÓN: Salto estilo Kahoot */
        @keyframes kahoot-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); } /* Sube 20 píxeles */
        }

        h1 { font-size: 2.2rem; color: var(--blue-chidori); text-transform: uppercase; margin-bottom: 10px; }

        .hud {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 1.2rem;
        }

        /* Estilo base de los círculos de progreso */
        .circle-progress {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(var(--blue-chidori) 0%, #2c3e50 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
            border: 3px solid #1a1a1a;
            transition: background 0.3s ease;
        }

        /* Panel contenedor final con separación */
        .end-stats-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            margin: 35px auto;
        }

        /* Cuadrados contenedores de líquido llenable */
        .stat-box {
            position: relative;
            padding: 25px 30px;
            border-radius: 15px;
            min-width: 100px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.05);
            transition: background 0.5s ease;
        }

        /* MODIFICADO: Clases de animación asignadas a los cuadrados al terminar */
        .correct-box.animate-bounce {
            animation: kahoot-bounce 1s ease-in-out infinite;
        }

        .wrong-box.animate-bounce {
            animation: kahoot-bounce 1s ease-in-out infinite;
            animation-delay: 0.5s; /* MODIFICADO: Retraso de medio segundo para desincronizar el salto */
        }

        /* Capa interna para los textos */
        .stat-content {
            position: relative;
            z-index: 2;
        }

        .stat-box .label {
            font-size: 0.95rem;
            text-transform: uppercase;
            color: #eee;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .stat-box .number {
            font-size: 2.8rem;
            font-weight: bold;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .stat-box.correct-box { border: 2px solid rgba(46, 204, 113, 0.4); }
        .stat-box.wrong-box { border: 2px solid rgba(231, 76, 60, 0.4); }

        .circle-large {
            width: 130px;
            height: 130px;
            font-size: 1.8rem;
            box-shadow: 0 0 25px rgba(52, 152, 219, 0.4);
            margin: 0;
        }

        .question-text {
            font-size: 1.5rem;
            margin-bottom: 30px;
            min-height: 80px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-option {
            background: #2c3e50;
            border: 3px solid transparent;
            color: white;
            padding: 20px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-option:hover { transform: scale(1.02); background: #34495e; }

        .btn-option.correct { background: var(--correct) !important; border-color: #fff; color: white; }
        .btn-option.correct::after { content: " ✔"; font-weight: bold; }

        .btn-option.wrong { background: var(--wrong) !important; border-color: #fff; color: white; }
        .btn-option.wrong::after { content: " ✘"; font-weight: bold; }

        .btn-action {
            background: var(--blue-chidori);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
            display: none;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        #final-score { font-size: 4rem; color: var(--blue-chidori); margin: 10px 0; }
        .creators { margin-top: 20px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

    <div id="main-card" class="game-container">
        <div id="start-screen" class="screen active">
            <h1>PREGUNTAS DEL CANVA</h1>
            <p>Misión: Dominar el conocimiento de las Aves.</p>
            <button class="btn-action" style="display:inline-block" onclick="startGame()">¡Ir a la aventura!</button>
            <p class="creators">Página web hecha por Mario, Miriam, Carla, Maria, Joel</p>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="hud">
                <span>Fase: <b id="current-q">1</b>/12</span>
                <div class="circle-progress" id="circle-progress">0%</div>
                <span>Puntos: <b id="score">0</b> PUNTOS</span>
            </div>
            <div class="question-text" id="question-text"></div>
            <div id="options-container" class="options-grid"></div>
            <button id="next-btn" class="btn-action" onclick="loadQuestion()">Siguiente Pregunta ➔</button>
        </div>

        <div id="end-screen" class="screen">
            <h1>¡Misión Finalizada!</h1>
            <div id="final-score">0</div>
            
            <div class="end-stats-container">
                <div class="stat-box correct-box" id="correct-box">
                    <div class="stat-content">
                        <div class="label">Aciertos</div>
                        <div class="number" id="final-correct">0</div>
                    </div>
                </div>
                
                <div class="circle-progress circle-large" id="final-circle-progress">0%</div>
                
                <div class="stat-box wrong-box" id="wrong-box">
                    <div class="stat-content">
                        <div class="label">Fallos</div>
                        <div class="number" id="final-wrong">0</div>
                    </div>
                </div>
            </div>

            <p id="rank"></p>
            <p id="naruto-msg" style="color: #f39c12; font-weight: bold; font-size: 1.3rem;"></p>
            <button class="btn-action" style="display:inline-block" onclick="location.reload()">Volver de nuevo a la Aventura</button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "¿Cuál es la característica principal que cubre el cuerpo de las aves?", a: ["Pelaje denso", "Plumas", "Escamas óseas", "Piel desnuda"], c: 1 },
            { q: "¿Cómo es la reproducción de las aves según su nacimiento?", a: ["Vivípara", "Ovípara", "Fragmentación", "Esporas"], c: 1 },
            { q: "¿De qué grupo de dinosaurios descienden directamente las aves?", a: ["Saurópodos", "Terópodos", "Ornitópodos", "Pterodáctilos"], c: 1 },
            { q: "¿Qué característica especial poseen los huesos de las aves para ser ligeros?", a: ["Son de metal", "Son huesos huecos", "No tienen huesos", "Son de cartílago"], c: 1 },
            { q: "¿Cuál es el hábitat típico del flamenco?", a: ["Bosques nevados", "Desiertos de arena", "Lagos, salinos o costas", "Selvas tropicales"], c: 2 },
            { q: "¿De qué se alimentan los flamencos de mayor tamaño?", a: ["Solo algas", "Peces grandes", "Moluscos o crustáceos", "Frutos secos"], c: 2 },
            { q: "¿Dónde se distribuyen principalmente los pingüinos?", a: ["Hemisferio Norte", "Hemisferio Sur", "Zonas Ecuatoriales", "Desiertos de África"], c: 1 },
            { q: "¿Qué parte del periquito es clave para reconocer su sexo y salud?", a: ["Las garras", "Las alas", "La cera", "La cola"], c: 2 },
            { q: "¿Cómo se llama el grupo de aves que no pueden volar, como el avestruz?", a: ["Corredoras", "Nadadoras", "Rapaces", "Canto"], c: 0 },
            { q: "¿Qué órgano utilizan las aves para triturar el alimento ya que no tienen dientes?", a: ["Hígado", "Molleja", "Pulmón", "Riñón"], c: 1 },
            { q: "¿Cuál es el sentido más desarrollado en la mayoría de las aves?", a: ["El olfato", "El gusto", "La vista", "El tacto"], c: 2 },
            { q: "¿Qué tipo de respiración tienen las aves?", a: ["Branquial", "Cutánea", "Pulmonar con sacos aéreos", "No respiran"], c: 2 }
        ];

        let currentIdx = 0;
        let score = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let canAnswer = true;

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentIdx >= questions.length) { showEnd(); return; }
            
            canAnswer = true;
            document.getElementById('next-btn').style.display = 'none';
            const qData = questions[currentIdx];
            
            document.getElementById('current-q').innerText = currentIdx + 1;
            document.getElementById('question-text').innerText = qData.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            qData.a.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(i, btn);
                container.appendChild(btn);
            });

            let percent = Math.round((correctAnswers / questions.length) * 100);
            const circle = document.getElementById('circle-progress');
            circle.innerText = percent + "%";
            circle.style.background = `conic-gradient(var(--blue-chidori) ${percent}%, #2c3e50 ${percent}%)`;
        }

        function checkAnswer(idx, btn) {
            if (!canAnswer) return;
            canAnswer = false;

            const correctIdx = questions[currentIdx].c;
            const options = document.querySelectorAll('.btn-option');
            const circle = document.getElementById('circle-progress');

            if (idx === correctIdx) {
                correctAnswers++;
                let percent = Math.round((correctAnswers / questions.length) * 100);
                circle.innerText = percent + "%";
                
                btn.classList.add('correct');
                score += 100;
                document.getElementById('score').innerText = score;
                circle.style.background = `conic-gradient(var(--correct) ${percent}%, #2c3e50 ${percent}%)`;
            } else {
                wrongAnswers++;
                let percent = Math.round((correctAnswers / questions.length) * 100);
                circle.innerText = percent + "%";

                btn.classList.add('wrong');
                options[correctIdx].classList.add('correct');
                document.getElementById('main-card').classList.add('shake');
                setTimeout(() => document.getElementById('main-card').classList.remove('shake'), 400);
                circle.style.background = `conic-gradient(var(--wrong) ${percent}%, #2c3e50 ${percent}%)`;
            }

            currentIdx++;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function showEnd() {
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('end-screen').classList.add('active');
            document.getElementById('final-score').innerText = score + " PUNTOS";
            
            document.getElementById('final-correct').innerText = correctAnswers;
            document.getElementById('final-wrong').innerText = wrongAnswers;
            
            let correctPercent = Math.round((correctAnswers / questions.length) * 100);
            let wrongPercent = Math.round((wrongAnswers / questions.length) * 100);
            
            // Relleno de líquido vertical
            const cBox = document.getElementById('correct-box');
            cBox.style.background = `linear-gradient(to top, rgba(46, 204, 113, 0.7) ${correctPercent}%, rgba(255,255,255,0.05) ${correctPercent}%)`;
            // MODIFICADO: Activamos la animación de salto al llegar al final
            cBox.classList.add('animate-bounce');

            const wBox = document.getElementById('wrong-box');
            wBox.style.background = `linear-gradient(to top, rgba(231, 76, 60, 0.7) ${wrongPercent}%, rgba(255,255,255,0.05) ${wrongPercent}%)`;
            // MODIFICADO: Activamos la animación de salto al llegar al final
            wBox.classList.add('animate-bounce');

            // Rellena el círculo central
            let finalPercent = Math.round((correctAnswers / questions.length) * 100);
            const finalCircle = document.getElementById('final-circle-progress');
            finalCircle.innerText = finalPercent + "%";
            finalCircle.style.background = `conic-gradient(var(--correct) ${finalPercent}%, #2c3e50 ${finalPercent}%)`;
            
            let rank = "";
            let msg = "";
            
            if (score >= 1000) {
                rank = "¡Rango: LEGENDARIO!";
                msg = "¡Aprobarás biología, haz caso a Naruto!";
            } else if (score >= 600) {
                rank = "¡Rango: NINJA!";
                msg = "Buen trabajo, pero un ninja siempre entrena más.";
            } else {
                rank = "¡Rango: ESTUDIANTE ACADEMIA!";
                msg = "Necesitas estudiar más los pergaminos de biología.";
            }
            
            document.getElementById('rank').innerText = rank;
            document.getElementById('naruto-msg').innerText = msg;
        }
    </script>
</body>
</html>
